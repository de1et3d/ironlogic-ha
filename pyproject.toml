[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "TRY", "G", "S"]
ignore = [
    "BLE001",   # blind except Exception — ok in HA integrations
    "SIM102",   # nested if — readability
    "SIM117",   # nested with — readability
    "SIM103",   # return condition directly — readability
    "G201",     # use .exception instead of .error(exc_info=True) — cosmetic
    "S110",     # try/except/pass — ok for cleanup
    "TRY401",   # redundant exception in logging.exception — cosmetic
    "TRY003",   # long messages in raise — ok
    "TRY301",   # raise inside try — ok
    "TRY300",   # return in try — cosmetic, else-block not worth it
    "N818",     # exception names without Error suffix — HA convention
    "B905",     # zip without strict= — not needed
    "S104",     # binding to 0.0.0.0 — required for controller access
    "E501",     # line too long — line-length handles most, ignore rest
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802"]
"custom_components/ironlogic/config_flow.py" = ["S101"]